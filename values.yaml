
replicaCount: 1
namespace: default
image:
  repository: ghcr.io/cloudraftio/metrics-app
  tag: "1.0"
  pullPolicy: Always

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: "my-appserviceaccount"


service:
  type: ClusterIP
  port: 80

configMAP: true
ingress:
  enabled: true
  className: "nginx"
  annotations: 
  # kubernetes.io/ingress.class: nginx
  # kubernetes.io/tls-acme: "true"
  meta.helm.sh/release-name: nginx-ingress
  meta.helm.sh/release-namespace: nginx-ingress
  hosts:
    - host: localhost
      paths:
        - path: /
          pathType: ImplementationSpecific
  #tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

resources: 
   limits:
     cpu: 100m
     memory: 128Mi
   requests:
     cpu: 100m
     memory: 128Mi

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 2
  targetCPUUtilizationPercentage: 50
  targetMemoryUtilizationPercentage: 50

secretsEnabled: true
secretName: my-app-secret
name: metrics-app