apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.name }}
  labels:
   app: {{ .Values.name }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      app: {{ .Values.name }}
  template:
    metadata:
      labels:
       app: {{ .Values.name }}
    spec:
      serviceAccountName:  {{ .Values.serviceAccount.name }}
      containers:
        - name: {{ .Values.name  }}
          image: "{{ .Values.image.repository }}:{{.Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: PASSWORD
              valueFrom:
                secretKeyRef:
                  name: my-app-secret   
                  key: PASSWORD     
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /
              port: http
          readinessProbe:
            httpGet:
              path: /
              port: http
          resources:
            requests:
              cpu: {{ .Values.resources.requests.cpu }}      
              memory: {{ .Values.resources.requests.memory }}   
            limits:
              cpu: {{ .Values.resources.limits.cpu }}  
              memory: {{ .Values.resources.limits.memory }}  
