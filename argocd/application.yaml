apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: my-app       
  namespace: argocd        
spec:
  project: default         
  source:
    repoURL: 'https://github.com/cloudraftio/sre-assignment.git'    
    targetRevision: main
    path: 'sre-assignment/myapp/values.yaml'    
  destination:
    server: 'https://kubernetes.default.svc'  
    namespace: default    
  syncPolicy:
    automated:
      prune: true          
      selfHeal: true       
